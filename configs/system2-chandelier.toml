# System 2 entries with an explicitly alternate exit.
schema_version = 2

[strategy]
entry_strategy = "turtle_s2"
exit_strategy = "chandelier"
allow_short = false
chandelier_timeframe = "session"
chandelier_length = 22
chandelier_atr_length = 22
chandelier_multiple = 3.0
chandelier_ratchet = true

[risk]
starting_cash = "25000"
unit_fraction = "0.01"

[execution]
market_hours = "regular"
